name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
env: {PYTHONUTF8: "1"}
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # private (pilot week): Linux only, to save Actions minutes; public: Linux + macOS (Windows: see ROADMAP)
        # ubuntu-22.04 pinned, not -latest: the -latest image moved to 26.04, which setup-python has no 3.9 build for
        os: ${{ github.event.repository.private && fromJSON('["ubuntu-22.04"]') || fromJSON('["ubuntu-22.04","macos-latest"]') }}
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m pip install -r requirements-dev.txt
      - name: Leak guard (personal data, secrets, private paths)
        run: python tools/leak_guard.py .
      - name: Tests
        run: python tools/run_tests.py
